<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="440" viewBox="0 0 1200 440"
     role="img" aria-labelledby="title desc">
  <title id="title">dokit — Documentation Operating System</title>
  <desc id="desc">dokit packages DocOS, a complete documentation standard, as a Claude Code skill. A docs folder tree shows numbered sections such as 00-governance, 06-api and 19-decisions.</desc>

  <rect width="1200" height="440" rx="24" fill="#0f1318"/>

  <g id="title-block" transform="translate(64 0)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="18" letter-spacing="2.5" fill="#97a0aa">CLAUDE CODE SKILL<tspan fill="#e3aa4e"> · </tspan>DOCOS</text>

    <text y="190" font-size="96" font-weight="800" fill="#f2efe7">dokit</text>

    <text y="238" font-size="30" font-weight="600" fill="#e3aa4e">Documentation Operating System</text>

    <text y="282" font-size="21" fill="#97a0aa">A complete documentation standard: numbered</text>
    <text y="311" font-size="21" fill="#97a0aa">taxonomy, templates, lifecycle rules, and a docs</text>
    <text y="340" font-size="21" fill="#97a0aa">Definition of Done — for humans and AI agents.</text>
  </g>

  <g id="badges" transform="translate(64 404)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
    <rect x="0" y="-24" width="192" height="34" rx="17" fill="none" stroke="#2a323d"/>
    <text x="96" y="0" text-anchor="middle" fill="#97a0aa"><tspan fill="#e3aa4e">00 → 24</tspan> sections</text>

    <rect x="204" y="-24" width="152" height="34" rx="17" fill="none" stroke="#2a323d"/>
    <text x="280" y="0" text-anchor="middle" fill="#97a0aa"><tspan fill="#e3aa4e">11</tspan> templates</text>

    <rect x="368" y="-24" width="180" height="34" rx="17" fill="none" stroke="#2a323d"/>
    <text x="458" y="0" text-anchor="middle" fill="#97a0aa" direction="rtl"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif">استاندارد فارسی</text>
  </g>

  <g id="project-proof" transform="translate(672 60)">
    <rect width="464" height="320" rx="16" fill="#151b22" stroke="#2a323d"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" transform="translate(26 0)">
      <text y="44" fill="#e3aa4e" font-weight="700">docs/</text>
      <text y="72"><tspan fill="#5c6672">├─ </tspan><tspan fill="#f2efe7">AI_INDEX.md</tspan></text>
      <text y="100"><tspan fill="#5c6672">├─ </tspan><tspan fill="#e3aa4e">00-</tspan><tspan fill="#f2efe7">governance/</tspan></text>
      <text y="128"><tspan fill="#5c6672">├─ </tspan><tspan fill="#e3aa4e">04-</tspan><tspan fill="#f2efe7">domain/entities/</tspan></text>
      <text y="156"><tspan fill="#5c6672">├─ </tspan><tspan fill="#e3aa4e">06-</tspan><tspan fill="#f2efe7">api/openapi.yaml</tspan></text>
      <text y="184"><tspan fill="#5c6672">├─ </tspan><tspan fill="#e3aa4e">19-</tspan><tspan fill="#f2efe7">decisions/</tspan></text>
      <text y="212"><tspan fill="#5c6672">│  └─ </tspan><tspan fill="#f2efe7">ADR-0001-use-postgresql.md</tspan></text>
      <text y="240"><tspan fill="#5c6672">├─ </tspan><tspan fill="#e3aa4e">20-</tspan><tspan fill="#f2efe7">features/</tspan></text>
      <text y="268"><tspan fill="#5c6672">├─ </tspan><tspan fill="#e3aa4e">23-</tspan><tspan fill="#f2efe7">runbooks/</tspan></text>
      <text y="296"><tspan fill="#5c6672">└─ </tspan><tspan fill="#e3aa4e">24-</tspan><tspan fill="#f2efe7">reference/</tspan></text>
    </g>
  </g>
</svg>
