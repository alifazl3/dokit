<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="660" viewBox="0 0 1200 660"
     role="img" aria-labelledby="title desc">
  <title id="title">The DocOS docs taxonomy</title>
  <desc id="desc">Seven root index files plus twenty-five numbered sections, from 00-governance to 24-reference. Section 12-mobile is optional.</desc>

  <rect width="1200" height="660" rx="24" fill="#0f1318"/>

  <g id="header" transform="translate(46 0)">
    <text y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="30" font-weight="700"><tspan fill="#e3aa4e">docs/</tspan><tspan fill="#f2efe7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"> — one numbered home for every document</tspan></text>
    <text x="1108" y="60" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="18" fill="#97a0aa">7 root indexes · 25 sections</text>
  </g>

  <g id="root-files" transform="translate(46 86)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
    <rect x="0" width="118" height="36" rx="10" fill="#151b22" stroke="#262e38"/>
    <text x="59" y="24" text-anchor="middle" fill="#f2efe7">README.md</text>
    <rect x="128" width="108" height="36" rx="10" fill="#151b22" stroke="#262e38"/>
    <text x="182" y="24" text-anchor="middle" fill="#f2efe7">INDEX.md</text>
    <rect x="246" width="140" height="36" rx="10" fill="#151b22" stroke="#e3aa4e"/>
    <text x="316" y="24" text-anchor="middle" fill="#e3aa4e">AI_INDEX.md</text>
    <rect x="396" width="118" height="36" rx="10" fill="#151b22" stroke="#262e38"/>
    <text x="455" y="24" text-anchor="middle" fill="#f2efe7">OWNERS.md</text>
    <rect x="524" width="140" height="36" rx="10" fill="#151b22" stroke="#262e38"/>
    <text x="594" y="24" text-anchor="middle" fill="#f2efe7">GLOSSARY.md</text>
    <rect x="674" width="130" height="36" rx="10" fill="#151b22" stroke="#262e38"/>
    <text x="739" y="24" text-anchor="middle" fill="#f2efe7">ROADMAP.md</text>
    <rect x="814" width="152" height="36" rx="10" fill="#151b22" stroke="#262e38"/>
    <text x="890" y="24" text-anchor="middle" fill="#f2efe7">CHANGELOG.md</text>
